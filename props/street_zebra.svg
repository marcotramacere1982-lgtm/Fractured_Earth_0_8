  <rect class="detail" x="8" y="10" width="84" height="14" rx="0" fill="none" stroke="currentColor" stroke-width="3"/>
  <rect class="detail" x="8" y="43" width="84" height="14" rx="0" fill="none" stroke="currentColor" stroke-width="3"/>
  <rect class="detail" x="8" y="76" width="84" height="14" rx="0" fill="none" stroke="currentColor" stroke-width="3"/>
