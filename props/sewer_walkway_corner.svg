<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Walkway corner: the ledge runs along the front (bottom) and the right side. -->
  <path class="solid" d="M0 0 H80 V80 H0 Z" fill="currentColor" fill-opacity="0.25" stroke="none"/>
  <path class="solid" d="M80 0 H100 V100 H0 V80 H80 Z" fill="currentColor" fill-opacity="0.55" stroke="none"/>
  <path class="detail" d="M0 80 H80 V0" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M0 40 H80 M40 0 V80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
