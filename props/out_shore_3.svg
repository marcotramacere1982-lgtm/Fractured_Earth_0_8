<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- A long shore, 3 × 1, with a small cove biting into the land. The shoreline meets the edges only at the middle of a side, so every shore piece joins every other. -->
  <path class="solid" d="M0 0 H300 V100 H0 Z" fill="currentColor" fill-opacity="0.2" stroke="none"/>
  <path class="solid" d="M0 50 C40 42 60 60 100 54 C130 50 140 22 170 20 C200 18 210 48 240 52 C266 56 284 44 300 50 V100 H0 Z" fill="currentColor" fill-opacity="0.55" stroke="none"/>
  <path class="detail" d="M0 50 C40 42 60 60 100 54 C130 50 140 22 170 20 C200 18 210 48 240 52 C266 56 284 44 300 50" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M0 50 C40 42 60 60 100 54 C130 50 140 22 170 20 C200 18 210 48 240 52 C266 56 284 44 300 50" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 7)" stroke-dasharray="3 5"/>
</svg>
