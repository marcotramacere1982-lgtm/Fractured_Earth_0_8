  <path class="solid" d="M78 76 H94 V92 H78 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  <circle class="detail" cx="50" cy="54" r="3" fill="currentColor" stroke="none"/>
