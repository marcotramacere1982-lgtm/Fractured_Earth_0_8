  <path class="detail" d="M100 0 V100" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.5"/>
  <path class="detail" d="M57 0 V100 M143 0 V100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 10" stroke-dashoffset="-5"/>
