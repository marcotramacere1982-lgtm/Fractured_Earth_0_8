<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shore bend, 1 × 1: from the left side to the bottom; the land is the bottom-left corner, water all round. The shoreline meets the edges only at the middle of a side, so every shore piece joins every other. -->
  <path class="solid" d="M0 0 H100 V100 H0 Z" fill="currentColor" fill-opacity="0.2" stroke="none"/>
  <path class="solid" d="M0 50 C26 46 46 64 50 100 H100 V0 H0 Z" fill="currentColor" fill-opacity="0.55" stroke="none"/>
  <path class="detail" d="M0 50 C26 46 46 64 50 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M0 50 C26 46 46 64 50 100" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 7)" stroke-dasharray="3 5"/>
</svg>
