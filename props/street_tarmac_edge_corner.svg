<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tarmac with the solid edge line turning a sharp corner: along the left and the top (turn it for the other corners). -->
  <path class="solid" d="M0 0 H100 V100 H0 Z" fill="currentColor" fill-opacity="0.45" stroke="none"/>
  <path class="detail" d="M12 100 V12 H100" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt"/>
</svg>
