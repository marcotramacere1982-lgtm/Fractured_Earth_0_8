<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cliff bend, 1 × 1: from the left side to the bottom; the drop is the bottom-left corner. The cliff meets the edges only at the middle of a side. -->
  <path class="solid" d="M0 0 H100 V100 H0 Z" fill="currentColor" fill-opacity="0.2" stroke="none"/>
  <path class="solid" d="M0 50 C26 46 46 64 50 100 H0 Z" fill="currentColor" fill-opacity="0.6" stroke="none"/>
  <path class="detail" d="M0 50 C26 46 46 64 50 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M0 50 C26 46 46 64 50 100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 10)" stroke-dasharray="2 6"/>
</svg>
