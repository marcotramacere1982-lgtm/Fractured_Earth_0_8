  <path class="detail" d="M38 38 H62 V62 H38 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="solid" d="M47 47 H53 V53 H47 Z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
</svg>
