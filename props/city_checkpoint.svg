  <path class="solid" d="M60 46 H70 V60 H60 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  <path class="detail" d="M40 46 H58 M42 58 H60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M36 64 H64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 2"/>
