  <path class="detail" d="M24 40 H76 V68 H24 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="solid" d="M6 40 H22 V56 H6 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  <path class="solid" d="M78 40 H94 V56 H78 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  <path class="solid" d="M6 76 H22 V92 H6 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
