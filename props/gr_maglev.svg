<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Maglev guideway, 2 × 1: a raised concrete beam (top to bottom). You walk under it — place pillars to hold it up. -->
  <rect class="solid" x="30" y="0" width="140" height="100" rx="0" fill="none" stroke="currentColor" stroke-width="4"/>
  <path class="detail" d="M60 0 V100 M140 0 V100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M30 50 H170" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 6"/>
</svg>
