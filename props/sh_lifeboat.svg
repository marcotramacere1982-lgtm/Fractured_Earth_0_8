<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <!-- Autonomous lifeboat pod, 2 × 3: an enclosed capsule on its launch rails; the hatch at the front (bottom) opens. -->
  <rect class="solid" x="10" y="10" width="180" height="280" rx="60" fill="none" stroke="currentColor" stroke-width="5"/>
  <path class="detail" d="M40 60 H160 M40 240 H160" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="detail" cx="100" cy="120" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle class="detail" cx="100" cy="180" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <g class="closed-only"><path class="detail" d="M70 290 H130" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g>
  <g class="open-only"><path class="detail" d="M70 290 H80 M120 290 H130" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g>
</svg>
