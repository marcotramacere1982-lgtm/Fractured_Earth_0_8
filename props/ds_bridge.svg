<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A road bridge (left to right) over a canal (top to bottom). -->
  <path class="solid" d="M0 0 H100 V100 H0 Z" fill="currentColor" fill-opacity="0.15" stroke="none"/>
  <path class="solid" d="M18 0 H82 V100 H18 Z" fill="currentColor" fill-opacity="0.45" stroke="none"/>
  <path class="solid" d="M0 20 H100 V80 H0 Z" fill="currentColor" fill-opacity="0.3" stroke="none"/>
  <path class="detail" d="M0 20 H100 M0 80 H100" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M18 0 V20 M82 0 V20 M18 80 V100 M82 80 V100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
