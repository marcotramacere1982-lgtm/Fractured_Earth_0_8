  <path class="solid" d="M14 0 H86 V14 H100 V86 H86 V100 H14 V86 H0 V14 H14 Z" fill="currentColor" fill-opacity="0.45" stroke="none"/>
  <path class="detail" d="M14 0 V14 H0 M86 0 V14 H100 M86 100 V86 H100 M14 100 V86 H0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
