<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- A long cliff edge, 3 × 1. The cliff meets the edges only at the middle of a side. -->
  <path class="solid" d="M0 0 H300 V100 H0 Z" fill="currentColor" fill-opacity="0.2" stroke="none"/>
  <path class="solid" d="M0 50 C40 40 70 62 110 54 C150 46 170 30 200 34 C230 38 260 60 300 50 V100 H0 Z" fill="currentColor" fill-opacity="0.6" stroke="none"/>
  <path class="detail" d="M0 50 C40 40 70 62 110 54 C150 46 170 30 200 34 C230 38 260 60 300 50" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M0 50 C40 40 70 62 110 54 C150 46 170 30 200 34 C230 38 260 60 300 50" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 10)" stroke-dasharray="2 6"/>
</svg>
