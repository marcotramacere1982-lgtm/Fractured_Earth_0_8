<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- A bay, 2 × 2: the coast enters and leaves at the middle of the lower squares; the water reaches far into the land. The shoreline meets the edges only at the middle of a side, so every shore piece joins every other. -->
  <path class="solid" d="M0 0 H200 V200 H0 Z" fill="currentColor" fill-opacity="0.2" stroke="none"/>
  <path class="solid" d="M0 150 C30 140 30 60 80 40 C120 26 160 50 170 100 C176 130 186 146 200 150 V200 H0 Z" fill="currentColor" fill-opacity="0.55" stroke="none"/>
  <path class="detail" d="M0 150 C30 140 30 60 80 40 C120 26 160 50 170 100 C176 130 186 146 200 150" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M0 150 C30 140 30 60 80 40 C120 26 160 50 170 100 C176 130 186 146 200 150" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 7)" stroke-dasharray="3 5"/>
</svg>
