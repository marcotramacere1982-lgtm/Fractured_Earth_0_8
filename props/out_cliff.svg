<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cliff edge, 1 × 1: walkable ground at the back (top), the drop at the front (bottom). The cliff meets the edges only at the middle of a side. -->
  <path class="solid" d="M0 0 H100 V100 H0 Z" fill="currentColor" fill-opacity="0.2" stroke="none"/>
  <path class="solid" d="M0 50 C18 44 30 56 50 50 C70 44 82 56 100 50 V100 H0 Z" fill="currentColor" fill-opacity="0.6" stroke="none"/>
  <path class="detail" d="M0 50 C18 44 30 56 50 50 C70 44 82 56 100 50" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="detail" d="M0 50 C18 44 30 56 50 50 C70 44 82 56 100 50" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 10)" stroke-dasharray="2 6"/>
</svg>
